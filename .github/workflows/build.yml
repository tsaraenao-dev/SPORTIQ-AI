name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and validates gradle-wrapper.jar. Also puts Gradle 8.9 on PATH
      # as a fallback in case the wrapper jar is missing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Assemble debug APK
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace -PBACKEND_URL="$BACKEND_URL"
          else
            gradle :app:assembleDebug --stacktrace -PBACKEND_URL="$BACKEND_URL"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sportiq-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
```[cite: 8]

> **Fanamarihana ara-teknika (Vérification):** Misy asa antsoina hoe `backend-tests` eo am-piandohana izay mitaky dossier `backend/` misy fichier `requirements.txt`[cite: 8]. Raha toa ka mbola tsy nampidirinao ao amin'ny GitHub ny dossier `backend`, dia mety hisy marika mena io dingana io satria hitady an'io dossier io izy. Ny asa `build` kosa dia efa manana fiarovana tsara: raha tsy misy ilay `gradle-wrapper.jar` dia mampiasa ny `gradle` napetrak'ilay action ho azy izy[cite: 8].

